name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional adapters
        run: python -m pip install -e '.[mcp,gmail]'
      - name: Check public source allowlist
        run: python scripts/check_public_files.py
      - name: Test base starter
        run: python -m unittest discover -s tests -v
      - name: Check browser JavaScript
        run: node --check founder_crm/static/app.js
      - name: Test reviewed personalisation example
        run: |
          git apply --check docs/examples/agency-owner.patch
          git apply docs/examples/agency-owner.patch
          python -m unittest discover -s tests -v
