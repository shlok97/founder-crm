name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create demo before installing optional adapters
        run: python -m loop_crm --db data/install-smoke.db demo
      - name: Install real package with optional adapters
        run: python -m pip install '.[mcp,gmail]'
      - name: Check public source allowlist
        run: python scripts/check_public_files.py
      - name: Test installed package outside the checkout
        run: |
          smoke_dir=$(mktemp -d)
          cp -R tests "$smoke_dir/tests"
          cd "$smoke_dir"
          loop-crm --db cli.db init
          loop-crm --db cli.db dashboard
          python -c 'from importlib.resources import files; p = files("loop_crm"); assert (p / "schema.sql").is_file(); assert all((p / "static" / n).is_file() for n in ("index.html", "app.js", "style.css"))'
          python -m unittest discover -s tests -v
      - name: Check browser JavaScript
        run: node --check loop_crm/static/app.js
