[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loop-crm"
version = "0.4.0"
description = "A local CRM for the relationships and promises of an early-stage startup."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.urls]
Repository = "https://github.com/shlok97/loop-crm"
Issues = "https://github.com/shlok97/loop-crm/issues"

[project.optional-dependencies]
mcp = ["mcp>=1.12,<2"]
gmail = ["google-auth-oauthlib>=1.2,<2"]

[project.scripts]
loop-crm = "loop_crm.__main__:main"

[tool.setuptools]
packages = ["loop_crm"]
include-package-data = false

[tool.setuptools.package-data]
loop_crm = ["schema.sql", "static/*"]
