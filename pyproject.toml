[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "founder-crm"
version = "0.1.0"
description = "A local CRM for the relationships and promises of an early-stage startup."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.urls]
Repository = "https://github.com/shlok97/founder-crm"
Issues = "https://github.com/shlok97/founder-crm/issues"

[project.optional-dependencies]
mcp = ["mcp>=1.12,<2"]
gmail = ["google-auth-oauthlib>=1.2,<2"]

[project.scripts]
founder-crm = "founder_crm.__main__:main"

[tool.setuptools.package-data]
founder_crm = ["schema.sql", "static/*"]
