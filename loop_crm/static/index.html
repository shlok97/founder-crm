<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="crm-csrf" content="__CSRF__" />
    <title>Loop CRM</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span>loop<b>/</b>crm</a>
      <div class="topbar-meta">
        <span id="workspace-label">Your workspace</span>
        <span id="today-date"></span>
      </div>
      <button id="new-note" class="button primary">Capture a note</button>
    </header>
    <div id="demo-banner" class="demo-banner" hidden>
      Demo workspace. Every name and conversation here is fictional.
    </div>
    <div class="app">
      <aside class="rail">
        <nav aria-label="Main navigation">
          <button data-view="today" class="active"><span>Dashboard</span><b id="open-count"></b></button
          ><button data-view="tickets"><span>Tickets</span><b id="untold-count" title="Fixed, customer not told yet"></b></button
          ><button data-view="people"><span>Relationships</span></button
          ><button data-view="pipeline"><span>Pipeline</span></button
          ><button data-view="qualify"><span>Qualification</span></button
          ><button data-view="inbox"><span>Intake</span><b id="intake-count"></b></button
          ><button data-view="review"><span>Review</span><b id="review-count"></b></button
          ><button data-view="integrations"><span>Integrations</span></button
          ><button data-view="yours"><span>Make it yours</span></button>
        </nav>
        <div class="rail-bottom">
          <p><span class="status-dot"></span>Stored locally in SQLite</p>
          <p>Nothing is sent anywhere unless you connect it.</p>
          <button id="claude-help" class="text-button">Use with Claude</button>
        </div>
      </aside>
      <main>
        <section class="frame">
          <div class="page-head">
            <div>
              <div id="eyebrow" class="eyebrow"></div>
              <h1 id="page-title"></h1>
              <p id="page-description"></p>
            </div>
            <button id="new-account" class="button">Add a relationship</button>
          </div>
          <section id="stats" class="stats" aria-label="Workspace counts"></section>
          <section id="content" aria-live="polite"></section>
        </section>
      </main>
    </div>
    <div id="toast" role="status" hidden></div>
    <dialog id="dialog">
      <div class="dialog-head">
        <h2 id="dialog-title"></h2>
        <button id="close-dialog" class="icon-button" aria-label="Close dialog">×</button>
      </div>
      <div id="dialog-body"></div>
    </dialog>
    <script src="/app.js" defer></script>
  </body>
</html>
